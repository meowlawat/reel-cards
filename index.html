<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reel Cards · Learned</title><link rel="icon" href="data:,">
<style>
:root{--bg-primary:#0E0E12;--bg-card:#FFFFFF;--bg-elevated:#1A1A22;--text-primary:#FFFFFF;--text-secondary:#A0A0B0;--text-on-light:#0E0E12;--text-muted:#6B6B7B;--accent-gradient-start:#A855F7;--accent-gradient-end:#EC4899;--accent-solid:#A855F7;--success:#10B981;--warning:#F59E0B;--danger:#EF4444;--border-subtle:rgba(255,255,255,.08);--shadow-card:0 4px 24px rgba(0,0,0,.12);--shadow-elevated:0 8px 32px rgba(0,0,0,.24);--gradient:linear-gradient(115deg,#A855F7,#EC4899)}
*{box-sizing:border-box}body{margin:0;background:var(--bg-primary);color:white;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main,header,footer{max-width:1120px;margin:auto;padding:20px}header,nav,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header,.between{justify-content:space-between}header{border-bottom:1px solid var(--border-subtle)}strong{font-weight:700}.brand{font-size:20px}.brand b{color:#e48af0}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:#30303c;color:white;min-height:44px;padding:8px 16px;font-weight:600}button:hover{filter:brightness(1.12)}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #eed688;outline-offset:3px}button[disabled]{cursor:default}.nav{font-size:14px;background:transparent}.active{background:#393041}.hero{border-radius:16px;background:linear-gradient(115deg,#7833b9,#b4347e);padding:24px;min-height:180px;display:flex;flex-direction:column;justify-content:center}.hero h1{max-width:480px;margin:8px 0;font-size:28px;line-height:1.2}.label,small{font-size:12px;letter-spacing:.04em}.label{text-transform:uppercase;font-weight:700}h2{font-size:24px}h3{font-size:17px}h2,h3,p{margin:8px 0 12px}.grid{display:grid;gap:16px}.tile,.panel{padding:16px;background:var(--bg-elevated);border-radius:16px}.thumb{width:100%;aspect-ratio:16/9;display:grid;place-items:center;font-size:56px;position:relative;overflow:hidden;color:white}.thumb:before,.thumb:after{content:"";position:absolute;width:55%;aspect-ratio:1;border:2px solid #ffffff44;border-radius:50%;left:-18%;bottom:-50%}.thumb:after{left:72%;bottom:20%}.duration{position:absolute;bottom:8px;right:8px;background:#000a;padding:2px 8px;border-radius:8px}.meta,footer{color:var(--text-secondary)}.meta{margin:12px 0;font-size:13px}.primary,.saved{width:100%;background:linear-gradient(105deg,#8137bf,#a72c77)}.saved,.good{background:#10664e}.bad{background:#9b3045}.link{background:transparent;padding:0;text-align:left;font-size:17px}.content{max-width:680px;margin:0 auto}.white{background:white;color:#15151b;padding:24px;border-radius:16px;margin:16px 0}.steps{padding:0;list-style:none;counter-reset:num}.steps li{counter-increment:num;display:grid;grid-template-columns:24px 1fr;gap:12px;margin:12px 0}.steps li:before{content:counter(num);background:var(--gradient);color:white;height:24px;border-radius:50%;text-align:center;font-weight:bold}.library{width:100%;text-align:left;margin:8px 0;display:flex;align-items:center;gap:16px}.tiny{border-radius:12px;width:56px;height:56px;display:grid;place-items:center;font-size:28px}.review{display:grid;perspective:1000px;margin:16px 0}.face{grid-area:1/1;backface-visibility:hidden;transition:transform 400ms ease-out;min-height:240px;padding:24px;border-radius:16px;background:white;color:#15151b}.front{display:flex;flex-direction:column;align-items:start;justify-content:space-between;text-align:left}.back,.flipped .front{transform:rotateY(180deg)}.flipped .back{transform:rotateY(0)}.back{background:#f6eeff}.face strong{font-size:22px}summary{cursor:pointer}details{margin:16px 0}label{display:block;margin:8px 0}textarea{width:100%;border-radius:8px;padding:8px}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;color:#201828;padding:12px 20px;border-radius:12px;max-width:90vw;z-index:2}.bar{position:sticky;bottom:0;padding:8px 0;background:var(--bg-primary)}.bar button{min-height:56px}.sectiontitle{margin-top:24px}footer{font-size:12px}.empty{padding:32px 20px;text-align:center}.error{color:#ffa6ab}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:32px 40px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:root{
 --bg-primary:#fcf7ef;--bg-elevated:#fffdf8;--text-secondary:#6c5c59;
 --ink:#392e36;--berry:#823c56;--rose:#f6d9db;--sage:#cce2d1;--oat:#f2dfb9;
 --seam:#dfcec2;--gradient:linear-gradient(120deg,#854158,#724356)
}
body{background-color:var(--bg-primary);background-image:radial-gradient(#ddd1c4 0.7px,transparent 0.8px);background-size:12px 12px;color:var(--ink)}
header{border-color:var(--seam)}.brand,h1,h2,.face strong,.tile h3 button{font-family:Georgia,"Times New Roman",serif}
.brand{font-size:28px;letter-spacing:-1.4px}.brand b{color:var(--berry)}.brand:before{content:"✿";color:var(--berry);margin-right:8px}
button{background:#f1e7de;color:var(--ink)}button:hover{filter:brightness(.97)}:is(button,input,textarea,summary):focus-visible{outline:3px solid #764871}
.nav{padding:6px 12px}.nav.active{background:var(--rose)}.hero{position:relative;isolation:isolate;overflow:hidden;background:#f5e3db;border:1px solid var(--seam);padding:32px clamp(20px,4vw,52px);border-radius:24px;min-height:230px}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.03;letter-spacing:-.045em;font-weight:500;max-width:570px}.hero p{margin:4px 0 0;color:#67515b}
.hero .label,.face .label,.white .label{color:var(--berry)}.hero:after{content:"✿";position:absolute;z-index:-1;right:5%;font:190px/1 Georgia;color:#b37383;transform:rotate(12deg);background:#fcf3e6;border:2px dashed #c59f95;border-radius:48% 48% 10% 10%;padding:0 24px}
.sectiontitle{margin:30px 0 16px;font-size:28px;letter-spacing:-.03em}.tile,.panel,.white,.face{border:1px solid var(--seam);box-shadow:0 4px 0 #e9ded2;border-radius:20px}
.tile{padding:12px 12px 16px}.thumb[data-id]{border-radius:14px;background-color:var(--wash)!important;background-image:repeating-linear-gradient(90deg,transparent 0 17px,#ffffff36 17px 19px),repeating-linear-gradient(0deg,transparent 0 17px,#ffffff36 17px 19px)!important}
[data-id=r1]{--wash:#efc0a3}[data-id=r2]{--wash:var(--sage)}[data-id=r3]{--wash:#dad0e5}
.thumb:after{content:none}.thumb:before{width:5em;height:1.4em;left:50%;bottom:auto;top:8%;aspect-ratio:auto;border:none;border-radius:0;background:#fffbecb0;transform:translateX(-50%) rotate(-5deg);font-size:12px}
.thumb span{display:grid;place-items:center;width:1.7em;height:1.7em;background:#fffaec;border:2px solid #ffffff;border-radius:46% 54% 52% 48%;box-shadow:0 4px 0 #4933281c;transform:rotate(-6deg)}
.duration{background:#4a3545;color:white}.primary,.good{background:var(--berry);color:#fff}.saved,.bad{background:#efe5dc;color:#624752}.saved{border:1px dashed #caaeb8}.link{background:transparent}.tile h3 button{font-size:21px}.meta{font-size:13px}
.content{margin-top:16px}.white,.front{background:#fffdf6;color:var(--ink)}.back{background:#f7e5ea;color:var(--ink)}.face{padding:28px;box-shadow:0 5px 0 #e1cfc2}.face strong{font-size:clamp(26px,4vw,36px);line-height:1.2}.back hr{border:0;border-top:1px dashed #c2a2ac}.back summary{color:#71344f;font-weight:600}.library{background:#f7f1e8}.toast{background:#45343d;color:white}.error{color:#883548}.bar{background:var(--bg-primary)}.label{letter-spacing:.09em}footer{color:#675954}
@media(max-width:790px){.hero:after{display:none}.hero{min-height:185px}}@media(max-width:440px){header,main,footer{padding:14px}.brand{font-size:23px}.nav{padding:6px 8px}header,nav{gap:4px}.hero{padding:24px 20px}.hero h1{font-size:38px}}
</style></head><body><header><strong class="brand">Reel <b>Cards</b></strong><nav><button class="nav" data-act="feed">Reels</button><button class="nav" data-act="library">Learned</button><button class="nav" aria-label="Demo settings" data-act="settings">⚙</button></nav></header>
<main id="app"></main><div id="toast" role="status"></div><footer>Instagram feature study · ProdVerse / Social Media · Sample reels</footer><script src="data.js"></script><script>
const app=document.querySelector('#app'), online=location.protocol!=='file:', day=86400000;
let cards={},screen='feed',selected,origin='feed',queue=[],results=[],index=0,busy=false,persistent=true,timer;
const esc=value=>String(value).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const byId=id=>reels.find(r=>r.id===id);
const btn=(action,label,id='',cls='')=>'<button class="'+cls+'" data-act="'+action+'" data-id="'+id+'">'+label+'</button>';
function notify(msg){const el=document.querySelector('#toast');el.className='toast';el.textContent=msg;clearTimeout(timer);timer=setTimeout(()=>{el.textContent='';el.className=''},3000)}
function due(c){const now=Date.now();if(c.dueAt<now-day)return 'Overdue';if(c.dueAt<=now)return 'Due today';const d=new Date(c.dueAt);if(d.toDateString()===new Date(now+day).toDateString())return 'Reviews tomorrow';return 'Review '+d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
async function change(action,id,extra={}){
 if(online){const response=await fetch('/api/library',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id,...extra})});if(!response.ok)throw Error((await response.json()).error||'Could not save. Try again.');cards=await response.json();return}
 const now=Date.now();let c=cards[id];
 if(action==='save')cards[id]??={id,savedAt:now,reps:0,ease:2.5,interval:0,dueAt:now,lastReviewedAt:null};
 else if(action==='edit')Object.assign(c,extra);
 else{const correct=action==='correct';c.reps=correct?c.reps+1:0;c.ease=Math.max(1.3,c.ease+(correct?.1:-.2));c.interval=correct?(c.reps===1?1:c.reps===2?3:Math.round(c.interval*c.ease)):0;c.lastReviewedAt=now;c.dueAt=now+Math.max(1,c.interval)*day}
 try{localStorage.setItem('reelcards_state',JSON.stringify(cards))}catch{persistent=false}
}
function thumbnail(r){return '<button class="thumb" data-act="detail" data-id="'+r.id+'" aria-label="Preview '+r.title+'"><span>'+r.thumbnailEmoji+'</span><small class="duration">'+r.duration+'</small></button>'}
function saveButton(r){return cards[r.id]?'<button class="saved" disabled>Saved ✓</button>':btn('save','Save as Reel Card',r.id,'primary')}
function feed(){return '<section class="hero"><span class="label">Your learning scrapbook</span><h1>Little lessons<br>worth keeping.</h1><p>Save a tip from a reel. Try it from memory later.</p></section><h2 class="sectiontitle">From your reel feed</h2><div class="grid">'+reels.map(r=>'<article class="tile">'+thumbnail(r)+'<div class="row between meta"><span>'+r.creatorAvatar+' '+r.creator+'</span><span>'+r.savedCount+' saves</span></div><h3>'+btn('detail',r.title,r.id,'link')+'</h3>'+saveButton(r)+'</article>').join('')+'</div>'}
function detail(){const r=byId(selected),c=cards[r.id];return '<div class="content">'+btn(origin,'← '+(origin==='feed'?'Feed':'Library'))+'<h2>'+r.title+'</h2>'+thumbnail(r)+'<p class="meta">'+r.creatorAvatar+' '+r.creator+' · '+r.category+'</p><section class="white"><span class="label">What you’ll learn</span><h3>'+r.card.goal+'</h3><p>'+r.card.ingredients.join(' · ')+'</p><b class="label">Steps</b><ol class="steps">'+r.card.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol></section>'+(c?'<details class="panel"><summary>Edit my flashcard</summary><label>Question<textarea maxlength="1000" id="question">'+esc(c.question??r.card.reviewQuestion)+'</textarea></label><label>Answer<textarea maxlength="1000" id="answer">'+esc(c.answer??r.card.reviewAnswer)+'</textarea></label>'+btn('edit','Save edits',r.id)+'</details><div class="row">'+btn('review','Review now',r.id)+btn('library','Open in library')+'</div>':'<div class="bar">'+saveButton(r)+'</div>')+'</div>'}
function library(){const list=Object.values(cards),ready=list.filter(c=>c.dueAt<=Date.now());return '<div class="content"><h1>Your Learned <small>'+list.length+' cards</small></h1>'+(!list.length?'<div class="empty panel">📚<h2>No cards yet</h2><p>Save a reel from the feed to start your library.</p>'+btn('feed','Browse reels')+'</div>':(ready.length?'<div class="bar">'+btn('all','Review all due · '+ready.length,'','primary')+'</div>':'<p>Nothing due right now. Your next review is '+new Date(Math.min(...list.map(c=>c.dueAt))).toLocaleDateString()+'.</p>')+list.map(c=>{const r=byId(c.id);return '<div class="panel" style="margin:8px 0">'+btn('review','<span class="tiny" style="background:'+r.thumbnailGradient+'">'+r.thumbnailEmoji+'</span><span>'+r.title+'<br><small>'+r.category+' · '+due(c)+'</small></span>',r.id,'library')+btn('detail','View or edit card',r.id,'link')+'</div>'}).join(''))+'</div>'}
function review(){const id=queue[index],r=byId(id),c=cards[id];return '<div class="content"><div class="row between"><strong>'+ (index+1)+' of '+queue.length+'</strong>'+btn('library','Exit review ×')+'</div><h2>'+r.title+'</h2><div class="review"><button class="face front" data-act="flip"><span class="label">Recall from memory</span><strong>'+esc(c.question??r.card.reviewQuestion)+'</strong><span>Tap to reveal answer</span></button><div class="face back" inert><span class="label">Answer</span><p>'+esc(c.answer??r.card.reviewAnswer)+'</p><hr><span class="label">Follow-up</span><p>'+r.card.followUp+'</p><details><summary>Show follow-up answer</summary><p>'+r.card.followUpAnswer+'</p></details><div class="row">'+btn('correct','Got it ✓',id,'good')+btn('forgot','Forgot ✕',id,'bad')+'</div></div></div></div>'}
function summary(){return '<div class="content"><div class="white"><span class="label">Review complete</span><h1>Session complete 🏆</h1><p>'+results.length+' reviewed · '+results.filter(x=>x==='correct').length+' got it · '+results.filter(x=>x==='forgot').length+' forgot</p>'+queue.map(id=>'<p><b>'+byId(id).title+'</b><br>'+new Date(cards[id].dueAt).toLocaleString()+'</p>').join('')+'</div>'+btn('library','Back to library')+'</div>'}
function draw(){app.dataset.screen=screen;app.innerHTML=({feed,library,'card-detail':detail,review,summary,settings:()=>'<div class="content panel"><h2>Demo settings</h2><p>'+ (online?'Local server · SQLite library':'Offline · browser library')+'</p><p>Three sample reels have prepared lessons. Saving is optional. Your ratings determine the next review. Use “View or edit card” to personalise a question.</p>'+btn('feed','Back to reels')+'</div>'})[screen]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.act===screen))}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||busy)return;const a=b.dataset.act,id=b.dataset.id;busy=true;
 try{if(['feed','library','settings'].includes(a))screen=a;
 else if(a==='detail'){if(screen!=='card-detail')origin=screen;selected=id;screen='card-detail'}
 else if(a==='save'){await change(a,id);notify(persistent?'Added to your Learned library':'Demo mode — progress won’t persist.')}
 else if(a==='edit'){const question=document.querySelector('#question').value.trim(),answer=document.querySelector('#answer').value.trim();if(!question||!answer)throw Error('Please fill in both fields.');await change(a,id,{question,answer});notify('Edits saved')}
 else if(a==='review'||a==='all'){queue=a==='review'?[id]:Object.keys(cards).filter(k=>cards[k].dueAt<=Date.now());index=0;results=[];screen=queue.length?'review':'library'}
 else if(a==='flip'){const box=b.parentNode;box.classList.add('flipped');b.inert=true;box.lastElementChild.inert=false;box.querySelector('summary').focus();return}
 else if(a==='correct'||a==='forgot'){await change(a,id,{previous:cards[id].lastReviewedAt});results.push(a);index++;if(index===queue.length)screen='summary'}
 draw();if(!['save','edit'].includes(a))window.scrollTo(0,0)
 }catch(err){notify(err.message)}finally{busy=false}});
async function init(){try{if(online){const res=await fetch('/api/library');if(!res.ok)throw Error();cards=await res.json()}else{try{cards=JSON.parse(localStorage.getItem('reelcards_state')||'{}')||{}}catch{cards={}}}draw()}catch{app.innerHTML='<p class="error">The library is unavailable. Start server.py and reload, or open index.html directly for offline mode.</p>'}}
init();
</script></body></html>
